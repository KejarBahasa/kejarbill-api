name: Deploy to Dev

on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: kejarbahasa/kejar-bill-api:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    runs-on: [self-hosted, linux]
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull image terbaru dan restart container
        run: |
          mkdir -p /opt/kejarbahasa-dev/kejar-bill-api
          cp docker-compose.yml /opt/kejarbahasa-dev/kejar-bill-api/docker-compose.yml
          cd /opt/kejarbahasa-dev/kejar-bill-api
          printf "%s" "${{ secrets.DEV_ENV }}" > .env
          docker compose pull app
          docker compose up -d --remove-orphans
          docker image prune -f
